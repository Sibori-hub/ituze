<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0E3B2E">
    <title>ITUZE · No connection</title>
    <style>
        :root { color-scheme: light; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111827; }
        main { max-width: 22rem; margin: 1.5rem; padding: 2rem 1.5rem; background: #fff; border-radius: 1.5rem; box-shadow: 0 10px 30px -12px rgba(14, 59, 46, .25); text-align: center; }
        img { width: 72px; height: 72px; }
        h1 { margin: 1rem 0 .5rem; font-size: 1.25rem; }
        p { margin: 0 0 .75rem; color: #4b5563; font-size: .95rem; line-height: 1.5; }
        button { margin-top: .75rem; border: 0; border-radius: .75rem; background: #0E3B2E; color: #fff; padding: .75rem 1.25rem; font-weight: 600; font-size: .95rem; cursor: pointer; }
        button:focus-visible { outline: 3px solid #D9A441; outline-offset: 2px; }
        .lang { margin-top: 1.25rem; font-size: .8rem; color: #6b7280; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="ITUZE GREEN PLATFORM">
        <h1>No internet connection</h1>
        <p>ITUZE needs the internet to show your latest buildings, tenants and payments. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
        <p class="lang">Nta interineti · Pas de connexion internet</p>
    </main>
</body>
</html>
