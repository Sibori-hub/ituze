kind: wasmer.io/App.v0
name: ituze
owner: siboriwanjye
app_id: da_nBBIbtXU3rjQ
package: .
enableDatabase: true
enable_email: true
env:
  PHPIX_PHP_THREADS: '4'
jobs:
- name: after_deploy
  trigger: post-deployment
  action:
    execute:
      command: after_deploy
# Laravel's scheduled tasks (routes/console.php), one job each. Times are UTC: Kigali is UTC+2.
- name: tenancies_every_10_minutes
  trigger: '*/10 * * * *'
  action:
    execute:
      command: bash
      cli_args: ['-lc', 'cd /app && php artisan tenancies:activate-scheduled && php artisan tenancies:complete-apartment-stays']
      timeout: 5m
- name: rent_charges_daily
  trigger: '10 22 * * *'
  action:
    execute:
      command: bash
      cli_args: ['-lc', 'cd /app && php artisan rent:generate-charges']
      timeout: 10m
- name: lease_reminders_daily
  trigger: '0 6 * * *'
  action:
    execute:
      command: bash
      cli_args: ['-lc', 'cd /app && php artisan leases:send-reminders']
      timeout: 10m
- name: subscription_reminders_daily
  trigger: '5 6 * * *'
  action:
    execute:
      command: bash
      cli_args: ['-lc', 'cd /app && php artisan subscriptions:send-reminders']
      timeout: 10m
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    npm_version: '11'
    php_framework: laravel
    php_public_dir: public
    phpix: true
  anybuild.run/provider: laravel
  anybuild.run/version: 0.33.0
  wasmer.io/version: 7.5.0
